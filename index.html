<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>zequipo_bot — Panel</title>
<style>
  :root {
    --ink: #0B1220;
    --card: #121B2E;
    --card-border: #1F2C47;
    --texto: #EFE9DD;
    --texto-tenue: #8C93A6;
    --teal: #35C6B5;
    --teal-tenue: rgba(53, 198, 181, 0.14);
    --ambar: #E3A64B;
    --ambar-tenue: rgba(227, 166, 75, 0.14);
    --rojo: #D6634C;
    --rojo-tenue: rgba(214, 99, 76, 0.14);
    --gris: #5C6478;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px 16px 40px;
    background: var(--ink);
    color: var(--texto);
    font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2 {
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-weight: 600;
    margin: 0;
  }

  .num {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
  }

  header {
    margin-bottom: 22px;
  }

  header h1 {
    font-size: 1.5rem;
    letter-spacing: -0.01em;
  }

  header .subtitulo {
    color: var(--texto-tenue);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 14px;
  }

  .card-titulo {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--texto-tenue);
    margin-bottom: 10px;
  }

  /* ---- Resumen general ---- */
  .resumen-pct {
    font-size: 2.6rem;
    font-weight: 600;
    line-height: 1;
  }

  .resumen-fraccion {
    color: var(--texto-tenue);
    font-size: 0.95rem;
    margin-left: 8px;
  }

  .barra-confianza {
    position: relative;
    height: 10px;
    background: #1A2438;
    border-radius: 5px;
    margin: 14px 0 8px;
    overflow: visible;
  }

  .barra-rango {
    position: absolute;
    top: 0;
    height: 100%;
    background: var(--teal-tenue);
    border-radius: 5px;
  }

  .barra-punto {
    position: absolute;
    top: -3px;
    width: 16px;
    height: 16px;
    background: var(--teal);
    border-radius: 50%;
    border: 3px solid var(--ink);
    transform: translateX(-50%);
  }

  .barra-linea-50 {
    position: absolute;
    top: -4px;
    bottom: -4px;
    width: 1px;
    background: var(--gris);
  }

  .barra-etiquetas {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--texto-tenue);
  }

  .nota-rango {
    font-size: 0.78rem;
    color: var(--texto-tenue);
    margin-top: 10px;
    line-height: 1.5;
  }

  .fila-secundaria {
    display: flex;
    gap: 18px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--card-border);
  }

  .stat-chico { flex: 1; }
  .stat-chico .num { font-size: 1.2rem; font-weight: 600; display: block; }
  .stat-chico .label { font-size: 0.7rem; color: var(--texto-tenue); }

  /* ---- Combos (por par + horizonte) ---- */
  .combo {
    padding: 12px 0;
    border-bottom: 1px solid var(--card-border);
  }
  .combo:last-child { border-bottom: none; }

  .combo-cabecera {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .combo-nombre {
    font-size: 0.9rem;
    font-weight: 600;
  }

  .combo-pct {
    font-size: 0.95rem;
  }

  .combo-n {
    color: var(--texto-tenue);
    font-size: 0.75rem;
  }

  .barra-mini {
    position: relative;
    height: 6px;
    background: #1A2438;
    border-radius: 3px;
  }

  .barra-mini-rango {
    position: absolute;
    top: 0;
    height: 100%;
    border-radius: 3px;
  }

  /* ---- Recientes ---- */
  .senal-reciente {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--card-border);
    font-size: 0.83rem;
  }
  .senal-reciente:last-child { border-bottom: none; }

  .badge {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
  }
  .badge.ganada { background: var(--teal-tenue); color: var(--teal); }
  .badge.perdida { background: var(--rojo-tenue); color: var(--rojo); }
  .badge.empate { background: var(--ambar-tenue); color: var(--ambar); }
  .badge.sin_datos { background: rgba(140, 147, 166, 0.14); color: var(--gris); }

  .senal-info { flex: 1; min-width: 0; }
  .senal-par { font-weight: 600; }
  .senal-detalle { color: var(--texto-tenue); font-size: 0.75rem; }
  .senal-hora { color: var(--texto-tenue); font-size: 0.72rem; white-space: nowrap; }

  footer {
    text-align: center;
    color: var(--texto-tenue);
    font-size: 0.72rem;
    margin-top: 24px;
  }

  .vacio {
    color: var(--texto-tenue);
    font-size: 0.85rem;
    text-align: center;
    padding: 20px 0;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: aparecer 0.4s ease-out backwards; }
    .card:nth-child(1) { animation-delay: 0.02s; }
    .card:nth-child(2) { animation-delay: 0.08s; }
    .card:nth-child(3) { animation-delay: 0.14s; }
  }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<header>
  <h1>🗳️ zequipo_bot</h1>
  <div class="subtitulo">Sistema 5-de-7 indicadores — números reales, sin editar</div>
</header>

<div id="contenido">
  <div class="vacio">Cargando...</div>
</div>

<footer id="pie"></footer>

<script>
async function cargar() {
  const contenido = document.getElementById('contenido');
  try {
    const resp = await fetch('stats.json?t=' + Date.now());
    const s = await resp.json();
    render(s);
  } catch (e) {
    contenido.innerHTML = '<div class="vacio">No se pudo cargar stats.json todavía.</div>';
  }
}

function colorPorPct(pct) {
  if (pct >= 55) return 'var(--teal)';
  if (pct >= 45) return 'var(--ambar)';
  return 'var(--rojo)';
}

function badgeInfo(resultado) {
  const map = {
    GANADA: { clase: 'ganada', icono: '✓' },
    PERDIDA: { clase: 'perdida', icono: '✕' },
    EMPATE: { clase: 'empate', icono: '=' },
    SIN_DATOS: { clase: 'sin_datos', icono: '?' },
  };
  return map[resultado] || { clase: 'sin_datos', icono: '?' };
}

function formatearHora(iso) {
  const d = new Date(iso);
  return d.toLocaleString('es-PE', { timeZone: 'America/Lima', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function render(s) {
  const contenido = document.getElementById('contenido');
  const colorGeneral = colorPorPct(s.pct);

  let html = '';

  // ---- Card 1: resumen general ----
  html += `<div class="card">
    <div class="card-titulo">Resultado acumulado (sin contar empates ni sin-datos)</div>
    <div>
      <span class="resumen-pct num" style="color:${colorGeneral}">${s.total > 0 ? s.pct + '%' : '—'}</span>
      <span class="resumen-fraccion num">${s.wins}/${s.total} operaciones</span>
    </div>`;

  if (s.total > 0) {
    const lo = s.rango_lo, hi = s.rango_hi, pct = s.pct;
    html += `<div class="barra-confianza">
      <div class="barra-rango" style="left:${lo}%; width:${hi - lo}%"></div>
      <div class="barra-linea-50" style="left:50%"></div>
      <div class="barra-punto" style="left:${pct}%; background:${colorGeneral}"></div>
    </div>
    <div class="barra-etiquetas"><span>0%</span><span>50%</span><span>100%</span></div>
    <div class="nota-rango">Rango real probable (95% confianza): <strong class="num">${lo}%–${hi}%</strong>. La línea gris marca 50/50 — el punto de equilibrio exacto depende del payout de cada par en Pocket Option, que varía.</div>`;
  } else {
    html += `<div class="nota-rango">Todavía no hay señales con resultado GANADA/PERDIDA para calcular un %.</div>`;
  }

  html += `<div class="fila-secundaria">
    <div class="stat-chico"><span class="num">${s.empates}</span><span class="label">Empates</span></div>
    <div class="stat-chico"><span class="num">${s.sin_datos}</span><span class="label">Sin datos</span></div>
    <div class="stat-chico"><span class="num">${s.total + s.empates + s.sin_datos}</span><span class="label">Total señales</span></div>
  </div></div>`;

  // ---- Card 2: desglose por par + horizonte ----
  html += `<div class="card"><div class="card-titulo">Por par y horizonte</div>`;
  if (s.combos.length === 0) {
    html += `<div class="vacio">Sin datos suficientes todavía.</div>`;
  } else {
    for (const c of s.combos) {
      const color = colorPorPct(c.pct);
      html += `<div class="combo">
        <div class="combo-cabecera">
          <span class="combo-nombre">${c.nombre}</span>
          <span class="combo-pct num" style="color:${color}">${c.pct}%</span>
        </div>
        <div class="barra-mini">
          <div class="barra-mini-rango" style="left:${c.rango_lo}%; width:${c.rango_hi - c.rango_lo}%; background:${color}66"></div>
        </div>
        <div class="combo-n num">n=${c.total} (${c.wins}G) · rango ${c.rango_lo}%–${c.rango_hi}%</div>
      </div>`;
    }
  }
  html += `</div>`;

  // ---- Card 3: señales recientes ----
  html += `<div class="card"><div class="card-titulo">Últimas señales</div>`;
  if (s.recientes.length === 0) {
    html += `<div class="vacio">Todavía no hay señales registradas.</div>`;
  } else {
    for (const r of s.recientes) {
      const b = badgeInfo(r.resultado);
      html += `<div class="senal-reciente">
        <div class="badge ${b.clase}">${b.icono}</div>
        <div class="senal-info">
          <div class="senal-par">#${r.id} ${r.asset} <span style="color:var(--texto-tenue); font-weight:400">${r.direction} · ${r.horizon_min}min</span></div>
          <div class="senal-detalle">${r.entry_price ?? '—'} → ${r.exit_price ?? '—'}</div>
        </div>
        <div class="senal-hora">${formatearHora(r.hora)}</div>
      </div>`;
    }
  }
  html += `</div>`;

  contenido.innerHTML = html;
  document.getElementById('pie').textContent = 'Actualizado: ' + formatearHora(s.actualizado) + ' (hora Perú)';
}

cargar();
</script>

</body>
</html>
